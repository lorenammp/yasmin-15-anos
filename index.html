<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071427" />
    <title>Convite Yasmin 15 anos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Handlee&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="desktop-gate" aria-label="Aviso para visualização em desktop">
      <div class="desktop-gate-card">
        <p class="desktop-kicker">Convite digital</p>
        <h1>Melhor no celular</h1>
        <p>
          Este convite foi pensado para smartphones, em tela cheia e com áudio.
          No computador, você ainda pode visualizar em uma prévia mobile.
        </p>
        <button class="desktop-continue" type="button">Continuar</button>
      </div>
    </section>

    <main class="invite-shell" aria-label="Convite de 15 anos da Yasmin">
      <button class="opening-screen" type="button" aria-label="Clique para abrir o convite">
        <img
          class="opening-image"
          src="assets/convite-abertura.png"
          alt="Envelope azul em frente a um castelo iluminado à noite"
        />
        <img
          class="name-overlay"
          src="assets/yasmin-nome.png"
          alt="Yasmin XV anos"
        />
        <span class="open-label">clique para abrir</span>
      </button>

      <video
        class="invite-video"
        src="assets/convite-video.mp4"
        preload="auto"
        playsinline
      ></video>

      <audio
        class="invite-audio"
        src="assets/convite-audio.wav"
        preload="auto"
      ></audio>

      <section class="details-screen" aria-label="Informações da festa">
        <img
          class="details-image"
          src="assets/convite-final.png"
          alt="Convite da Yasmin com informações da festa"
        />

        <a
          class="hotspot hotspot-place"
          href="https://www.google.com/maps/search/?api=1&query=Espa%C3%A7o%20Garcias%2C%20Rua%20Guapuhy%2C%20229%2C%20S%C3%A3o%20Cosme%20de%20Baixo%2C%20Santa%20Luzia%2C%20MG%2C%2033130-060"
          target="_blank"
          rel="noreferrer"
          aria-label="Abrir localização no mapa"
        ></a>
        <button
          class="hotspot hotspot-gift"
          type="button"
          data-modal="gift"
          aria-label="Ver sugestão de presente"
        ></button>
        <button
          class="hotspot hotspot-dress"
          type="button"
          data-modal="dress"
          aria-label="Ver sugestão de traje"
        ></button>
      </section>

      <div class="modal-backdrop" hidden>
        <article class="info-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <button class="modal-close" type="button" aria-label="Fechar">×</button>
          <h2 id="modal-title"></h2>
          <div id="modal-body"></div>
        </article>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
